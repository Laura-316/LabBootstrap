<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Personal - Bootstrap</title>
    
    <!-- Enlace al archivo que descargaste -->
    <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-primary text-center">Mi Tarjeta Personal</h1>
        <p class="text-center">Pronto verás el diseño aquí.</p>

        <!-- TAREA 3: BOTONES CON NUEVOS COLORES PERSONALIZADOS -->
        <div class="text-center mt-4">
            <button type="button" class="btn btn-dark">Gris Oscuro (Dark)</button>
            <button type="button" class="btn btn-warning">Amarillo (Warning)</button>
            <button type="button" class="btn btn-info">Celeste (Info)</button>
        </div>
       

         <!-- TAREA 4: PÁRRAFOS CON ALINEACIÓN Y COLOR -->
        <div class="mt-5">
            <p class="text-start">Izquierda</p>
            <p class="text-center text-danger">Centro</p>
            <p class="text-end">Derecha</p>
        </div>

           <!-- TAREA 5: TARJETA PERSONAL CON GRUPO DE LISTAS -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                
                <div class="card">
                    <!-- Encabezado de la tarjeta -->
                    <div class="card-header text-center fw-bold">
                        Mi Perfil
                    </div>
                    
                    <!-- Imagen  -->
                    <img src="https://i.pinimg.com/736x/35/69/e3/3569e3ed43007eaf235fe55cf27efe60.jpg" class="card-img-top" alt="chica">
                    
                    <!-- Grupo de listas con los datos personales -->
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><strong>Nombre:</strong> Laura Torres</li>
                        <li class="list-group-item"><strong>Ciudad:</strong> Sabaneta, Antioquia</li>
                        <li class="list-group-item"><strong>Hobby:</strong> Hacer ejercicio</li>
                    </ul>
                </div>

            </div>
        </div>

    </div>



</body>
</html>
